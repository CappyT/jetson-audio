name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        with:
          filters: |
            kokoro:
              - 'kokoro/**'
            speaches:
              - 'speaches/**'
            workflow:
              - '.github/workflows/build.yaml'
      - name: select images to build
        id: select
        env:
          ALL_IMAGES: '["kokoro","speaches"]'
          CHANGED: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
        run: |
          set -euo pipefail
          # a tag push, a manual run or a change to this workflow rebuilds everything;
          # otherwise only the image directories touched by the push/pr are built
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            images="$ALL_IMAGES"
          else
            images=$(jq -c '. - ["workflow"]' <<<"$CHANGED")
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "building: \`$images\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: changes
    if: needs.changes.outputs.images != '' && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
      - name: read upstream ref
        id: upstream
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG [A-Z0-9_]*_REF=\(.*\)$/\1/p' "$IMAGE/Dockerfile" | head -n1)
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "$IMAGE tracks upstream \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cappyt/jetson-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.ref }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # aggregate gate with a stable name for required status checks: the matrix
  # job names vary per image and the build job may not run at all when no
  # image directory is touched, so neither can be required directly
  ci-ok:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check results
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = "success" ]
          case "$BUILD" in success|skipped) exit 0 ;; *) exit 1 ;; esac
